{t:"💊 Hemorragia posparto",g:"El útero está blando y la paciente sangra mucho. ¿Cómo actúas? Resuelve los 2 pasos.",k:"c",q:[["¿Cuál es la causa más frecuente?",["Atonía uterina","Laceración cervical","Coagulopatía"],0,"La atonía causa cerca del 70 % de las hemorragias posparto."],["¿Qué haces primero?",["Masaje uterino y oxitocina","Histerectomía","Solo observar"],0,"Masaje uterino y oxitocina son la primera línea; luego otros uterotónicos y ácido tranexámico."]],d:"Sangrado controlado con masaje uterino y oxitocina."}];
let W={};
function head(i){const m=MISS[i];return `<span class="tag">MISIÓN ${i+1}/5 · ${M.L[i]}</span><h3>${m.t}</h3><div class="exp">📋 <b>Guía:</b> ${m.g}</div>`}
function task(i){G.pause=1;SFX.click();W={i,n:0,sel:-1,qi:0};const k=MISS[i].k;k==="w"?wires(i):k==="o"?order(i):quiz(i)}
function wires(i){const C=["#e53935","#1e88e5","#fdd835","#43a047"];W.C=C;W.R=shuffle([0,1,2,3]);
 ov(head(i)+`<svg viewBox="0 0 300 190" style="max-width:340px;margin:auto;background:#222;border-radius:12px">${C.map((c,k)=>`<circle cx="30" cy="${30+k*45}" r="14" fill="${c}" stroke="#fff" stroke-width="3" onclick="pick(0,${k})"/>`).join("")}${W.R.map((k,j)=>`<circle cx="270" cy="${30+j*45}" r="14" fill="${C[k]}" stroke="#fff" stroke-width="3" onclick="pick(1,${k})"/>`).join("")}<g id="ln" style="pointer-events:none"></g></svg><p class="mut">Toca un cable de la izquierda y luego el del mismo color a la derecha.</p>`)}
function pick(s,k){SFX.click();if(!s){W.sel=k;return}if(W.sel<0)return;if(W.sel!==k){W.sel=-1;SFX.bad();return}
 const y1=30+k*45,y2=30+W.R.indexOf(k)*45;$("ln").innerHTML+=`<path d="M30 ${y1}C150 ${y1} 150 ${y2} 270 ${y2}" stroke="${W.C[k]}" stroke-width="7" fill="none"/>`;W.sel=-1;SFX.ok();if(++W.n>=4)setTimeout(()=>complete(W.i),600)}
function order(i){const m=MISS[i];ov(head(i)+`<div id="ol">${shuffle(m.s.map((x,k)=>({x,k}))).map(a=>`<button class="opt" data-k="${a.k}">${a.x}</button>`).join("")}</div><p class="mut" id="om">Toca el paso 1</p>`);
 document.querySelectorAll("#ol .opt").forEach(b=>b.onclick=()=>{if(+b.dataset.k===W.n){W.n++;b.disabled=1;b.classList.add("ok");b.textContent=W.n+". "+b.textContent;SFX.click();$("om").textContent=W.n<m.s.length?"Muy bien. Toca el paso "+(W.n+1):"¡Completo!";if(W.n>=m.s.length)setTimeout(()=>complete(W.i),500)}else{SFX.bad();$("om").textContent="❌ Ese paso no va ahora. ¿Cuál sigue?"}})}
function quiz(i){const m=MISS[i],q=m.q[W.qi];ov(head(i)+`<p><b>Paso ${W.qi+1}/${m.q.length}: ${q[0]}</b></p>${shuffle(q[1].map((x,k)=>({x,k}))).map(a=>`<button class="opt" data-k="${a.k}">${a.x}</button>`).join("")}<div id="fb"></div>`);
 document.querySelectorAll("#ovb .opt").forEach(b=>b.onclick=()=>{const r=+b.dataset.k===q[2];document.querySelectorAll("#ovb .opt").forEach(x=>{x.disabled=1;if(+x.dataset.k===q[2])x.classList.add("ok");else if(x===b)x.classList.add("bad")});
  if(r)SFX.ok();else{SFX.bad();G.lives--;hud()}
  $("fb").innerHTML=`<div class="exp"><b>${r?"✅ Correcto":"❌ Error clínico: pierdes una vida"}</b><br>${q[3]}</div><button class="btn" onclick="nextQ(${r?1:0})">CONTINUAR</button>`})}
function nextQ(r){if(G.lives<=0)return chk();if(r)W.qi++;if(W.qi>=MISS[W.i].q.length)complete(W.i);else quiz(W.i)}
function complete(i){G.C[i].sec=true;SFX.ok();hud();ov(head(i)+`<div class="exp"><b>✅ ¡Misión cumplida! Cuna asegurada 🔒</b><br>${MISS[i].d}</div><button class="btn" onclick="after()">CONTINUAR</button>`)}
function after(){if(G.lives<=0||G.lost>=3)return chk();if(G.C.every(c=>c.sec))return end(1,"¡Completaste las 5 misiones y todos los bebés están a salvo!");resume()}
function resume(){ovHide();G.pause=0}
function end(w,m){G.over=1;w?SFX.win():SFX.lose();ov(`<div class="logo" style="color:${w?"#35e06f":"#ff5252"}">${w?"¡VICTORIA!":"DERROTA"}</div><p>${m}</p><div class="big">🔒 ${G.C.filter(c=>c.sec).length}/5 · 👶❌ ${G.lost}</div><div class="row"><button class="btn" onclick="start()">↻ OTRA VEZ</button><button class="btn g" onclick="menu()">MENÚ</button></div>`)}
// ---- Pantallas ----
function ov(h){$("ovb").innerHTML=h;$("ov").style.display="block";$("ov").scrollTop=0}function ovHide(){$("ov").style.display="none"}
function bean(c,d){const k=`rgb(${[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*.72)).join()})`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100" height="125"><rect x="6" y="52" width="18" height="40" rx="8" fill="${k}"/><rect x="25" y="92" width="20" height="26" rx="8" fill="${k}"/><rect x="55" y="92" width="20" height="26" rx="8" fill="${k}"/><rect x="20" y="12" width="62" height="88" rx="30" fill="${c}"/><ellipse cx="62" cy="42" rx="22" ry="14" fill="#9ee7ff" stroke="#3b6e8a" stroke-width="3"/><ellipse cx="68" cy="37" rx="9" ry="4" fill="#fff" opacity=".7"/>`+(d?`<path d="M20 34Q20 4 51 4Q82 4 82 34Q51 22 20 34Z" fill="#1fb5a8"/><path d="M36 64Q51 100 66 64" stroke="#333" stroke-width="3.5" fill="none"/><circle cx="51" cy="86" r="5" fill="#cfd8dc" stroke="#333" stroke-width="2"/><rect x="26" y="70" width="14" height="14" rx="3" fill="#fff"/><path d="M33 72v10M28 77h10" stroke="#e91e63" stroke-width="3"/>`:"")+`</svg>`}
const IMG={};function img(c){if(!IMG[c]){const i=new Image();i.src="data:image/svg+xml;utf8,"+encodeURIComponent(bean(c,1));IMG[c]=i}return IMG[c]}
function menu(){G=null;let c=S.color;
 ov(`<div class="logo">OBSTETRA CREW<small>EL LADRÓN DE BEBÉS</small></div><div class="hero" id="hero">${bean(c,1)}</div><p class="mut">Un ladrón se hace pasar por personal y roba bebés de sus cunas. Completa las 5 misiones (luces, lavado de manos, recién nacido, preeclampsia y hemorragia) para asegurar cada cuna, interroga a los colegas (el ladrón dice errores clínicos) y atrapa al impostor.</p><input id="nm" maxlength="12" placeholder="Tu nombre" value="${S.name}"><div class="sw" id="sw">${COLORS.map(x=>`<b data-c="${x}" class="${x===c?"on":""}" style="background:${x}"></b>`).join("")}</div><div class="row" id="mp">${MAPS.map((m,i)=>`<button class="btn g ${i===S.map?"on":""}" data-i="${i}">${m.n}</button>`).join("")}</div><button class="btn" id="go">▶ JUGAR</button><p class="mut">PC: WASD/flechas · E usar · F preguntar · ESPACIO atrapar<br>Celular: joystick a la izquierda y botones a la derecha (horizontal)</p>`);
 document.querySelectorAll("#sw b").forEach(b=>b.onclick=()=>{c=b.dataset.c;document.querySelectorAll("#sw b").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("hero").innerHTML=bean(c,1)});
 document.querySelectorAll("#mp button").forEach(b=>b.onclick=()=>{S.map=+b.dataset.i;document.querySelectorAll("#mp button").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
 $("go").onclick=()=>{S.name=$("nm").value.trim()||"Doc";S.color=c;audio();start()}}
// ---- Render ----
function drawBean(e,me){const i=img(e.c);if(!i.complete)return;const bob=e.mv?Math.abs(Math.sin(G.t*12))*3:0;
 cx.fillStyle="#0005";cx.beginPath();cx.ellipse(e.x,e.y+2,13,5,0,0,7);cx.fill();
 cx.save();cx.translate(e.x,e.y);if(e.f)cx.scale(-1,1);cx.drawImage(i,-17,-42-bob,35,44);cx.restore();
 cx.textAlign="center";cx.font="bold 10px sans-serif";cx.fillStyle=me?"#ffd54a":"#fff";cx.fillText(e.n,e.x,e.y-48-bob);
 if(G.mk[e.n])cx.fillText(G.mk[e.n],e.x,e.y-60-bob);if(e.car!=null){cx.font="16px sans-serif";cx.fillText("👶",e.x+(e.f?12:-12),e.y-22)}}
function draw(){const w=cv.width,h=cv.height;sc=h/460;const vw=w/sc,P=G.P;
 camx=M.W<=vw?(M.W-vw)/2:Math.max(0,Math.min(M.W-vw,P.x-vw/2));camy=Math.max(0,Math.min(M.H-460,P.y-230));
 cx.setTransform(1,0,0,1,0,0);cx.fillStyle=M.dark?"#10231a":"#0b0b2a";cx.fillRect(0,0,w,h);cx.setTransform(sc,0,0,sc,-camx*sc,-camy*sc);
 for(const t of M.T){cx.fillStyle="#0b3d1e";cx.beginPath();cx.arc(t.x,t.y,t.r,0,7);cx.fill();cx.fillStyle="#145c2e";cx.beginPath();cx.arc(t.x-3,t.y-3,t.r*.6,0,7);cx.fill()}
 for(const a of M.A){cx.fillStyle=a[4];cx.fillRect(a[0],a[1],a[2],a[3]);if(!M.dark){cx.strokeStyle="#334155";cx.lineWidth=5;cx.strokeRect(a[0],a[1],a[2],a[3])}}
 cx.textAlign="center";cx.font="26px sans-serif";cx.fillText(M.X[2],M.X[0],M.X[1]+9);
 M.S.forEach((s,i)=>{const c=G.C[i],p=1+Math.sin(G.t*5)*.12;cx.beginPath();cx.arc(s[0],s[1],20*(c.sec?1:p),0,7);cx.fillStyle=c.sec?"#35e06f88":"#ffd54a99";cx.fill();cx.strokeStyle=c.sec?"#1b9e4b":"#e6a100";cx.lineWidth=3;cx.stroke();cx.font="20px sans-serif";cx.fillStyle="#000";cx.fillText(c.sec?"✔":EM[i],s[0],s[1]+7);
  cx.fillStyle="#8d6e63";cx.fillRect(c.x-14,c.y-9,28,18);cx.font="14px sans-serif";cx.fillStyle="#000";cx.fillText(c.sec?(c.baby?"🔒":"✔"):c.baby?"👶":"❌",c.x,c.y+5);
  cx.font="bold 9px sans-serif";cx.fillStyle=M.dark?"#fff":"#334155";cx.fillText(M.L[i],s[0],s[1]-26)});
 [...G.N,P].sort((a,b)=>a.y-b.y).forEach(e=>drawBean(e,e===P));
 cx.setTransform(1,0,0,1,0,0);
 if(M.dark||!G.C[0].sec){const f=G.C[0].sec?1.5:1,px=(P.x-camx)*sc,py=(P.y-camy-20)*sc,g=cx.createRadialGradient(px,py,110*f*sc,px,py,(M.dark?330:420)*f*sc);g.addColorStop(0,"#0000");g.addColorStop(1,"#02060ef0");cx.fillStyle=g;cx.fillRect(0,0,w,h)}
 const mw=170*dpr,ms=mw/M.W,mx=w-mw-8*dpr,my=34*dpr;cx.fillStyle="#000a";cx.fillRect(mx-3,my-3,mw+6,M.H*ms+6);
 M.A.forEach(a=>{cx.fillStyle="#fff5";cx.fillRect(mx+a[0]*ms,my+a[1]*ms,a[2]*ms,a[3]*ms)});
 G.C.forEach(c=>{cx.fillStyle=c.sec?"#35e06f":c.baby?"#ffd54a":"#ff3b3b";if(c.baby||c.sec||Math.sin(G.t*8)>0){cx.beginPath();cx.arc(mx+c.x*ms,my+c.y*ms,3.5*dpr,0,7);cx.fill()}});
 cx.fillStyle="#fff";cx.beginPath();cx.arc(mx+P.x*ms,my+P.y*ms,4*dpr,0,7);cx.fill()}
function resize(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx=cv.getContext("2d")}
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(G){if(!G.pause&&!G.over)upd(dt);draw()}requestAnimationFrame(loop)}
// ---- Controles ----
const cv=$("cv"),z=$("zone");let jo=null;
z.onpointerdown=e=>{jo={x:e.clientX,y:e.clientY};z.setPointerCapture(e.pointerId);const b=$("jb"),k=$("jk");b.style.cssText=`display:block;left:${jo.x-50}px;top:${jo.y-50}px`;k.style.cssText=`display:block;left:${jo.x-22}px;top:${jo.y-22}px`};
z.onpointermove=e=>{if(!jo)return;let dx=e.clientX-jo.x,dy=e.clientY-jo.y;const d=Math.hypot(dx,dy);if(d>50){dx*=50/d;dy*=50/d}jx=dx/50;jy=dy/50;$("jk").style.left=jo.x+dx-22+"px";$("jk").style.top=jo.y+dy-22+"px"};
z.onpointerup=z.onpointercancel=()=>{jo=null;jx=jy=0;$("jb").style.display=$("jk").style.display="none"};
$("b1").onpointerdown=useIt;$("b2").onpointerdown=ask;$("b3").onpointerdown=grab;
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();K[k]=1;if(k==="e")useIt();if(k==="f")ask();if(k===" ")grab()});
addEventListener("keyup",e=>K[e.key.toLowerCase()]=0);addEventListener("blur",()=>Object.keys(K).forEach(k=>K[k]=0));
addEventListener("resize",resize);
$("fs").onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else(d.requestFullscreen?d.requestFullscreen():Promise.reject()).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})).catch(()=>toast("Pantalla completa no disponible"))};
$("mu").onclick=()=>{mute=!mute;$("mu").textContent=mute?"🔇":"🔊"};
resize();menu();requestAnimationFrame(loop);
</script>
